[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
rust-version = "1.99"
repository = "https://github.com/soof-golan/charcraft"

[workspace.dependencies]
# Internal crates (see ARCHITECTURE.md for what each one owns).
charcraft-ltab = { path = "crates/ltab" }
charcraft-rope = { path = "crates/rope" }
charcraft-project = { path = "crates/project" }
charcraft-puppet = { path = "crates/puppet" }
charcraft-behaviors = { path = "crates/behaviors" }
charcraft-tracking = { path = "crates/tracking" }
charcraft-record = { path = "crates/record" }

# Shared engine crates from anicraft-libs. While we build they follow main (Cargo.lock pins the commit; run
# `cargo update -p anim-x` to pick up new work); releases switch to `rev = "..."` pins.
anim-core = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-display = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-archive = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-shape = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-scene = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-morph = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-text = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-timeline = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-render = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-rig = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-audio = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-lipsync = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-artwork = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-export = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-video = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-ui = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
anim-session = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main" }
# MCP without the streamable-HTTP front-end: the app serves stdio and the loopback control channel.
anim-mcp = { git = "https://github.com/soof-golan/anicraft-libs", branch = "main", default-features = false }

# External crates (versions match anicraft-libs so the lockfiles agree).
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
rayon = "1.11"
crossbeam-channel = "0.5"
tiny-skia = "0.12"
parley = "0.11"
skrifa = "0.44"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
gif = "0.14"
cpal = "0.16"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "pcm", "aac", "isomp4", "flac", "ogg", "vorbis"] }
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
proptest = "1"
tempfile = "3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
dirs = "7"
ureq = "3"
# Live input (charcraft-tracking). ONNX Runtime is a release candidate: pin it exactly. The crate picks the linking
# mode (downloaded static binaries or a runtime-loaded library) through its own features.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

# anim-artwork reads Illustrator files through VectorCraft's PDF stack. Patches don't propagate through git
# dependencies, so the pins VectorCraft needs are repeated here (same revs as its own root manifest).
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }

[workspace.lints.rust]
unsafe_code = "forbid"

# namtao.com/rust strict lints: teach Rust and prevent runtime panics.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
dbg_macro = "deny"

# Dev profile for everything except benchmarks (Craft convention: optimised deps, fast incremental builds).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
