[package]
name = "charcraft-tracking"
description = "Webcam face tracking as an actor: camera capture (nokhwa), face landmarks (ONNX Runtime), landmark to face-parameter maths, calibration and smoothing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["download"]
# Webcam capture through nokhwa (V4L2, AVFoundation, Media Foundation).
camera = ["dep:nokhwa", "files"]
# Pictures standing in for a camera: a photo, an animated GIF or a folder of images.
files = ["dep:image"]
# Face detection and landmarks through ONNX Runtime, linked from binaries ONNX Runtime's build downloads
# (needs glibc 2.38+ and a recent libstdc++ on Linux: Ubuntu 24.04, Fedora 39, Debian 13).
onnx = ["onnx-runtime", "ort/download-binaries", "ort/tls-rustls", "ort/copy-dylibs"]
# The same, with libonnxruntime loaded at run time from ORT_DYLIB_PATH: for older Linux distributions, packaged
# apps that ship their own runtime, and Jetson (JetPack's ONNX Runtime).
onnx-dynamic = ["onnx-runtime", "ort/load-dynamic"]
# Internal: the ONNX Runtime code, shared by both linking modes.
onnx-runtime = ["dep:ort"]
# Fetch model weights on first use (verified against the registry's SHA-256).
download = ["dep:ureq"]

[dependencies]
anim-core = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif"], optional = true }
nokhwa = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true, features = ["jpeg", "gif"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "probe"
required-features = ["onnx-runtime"]

[[example]]
name = "pose_probe"
required-features = ["onnx-runtime"]
